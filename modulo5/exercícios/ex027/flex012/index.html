<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            
            
        }

        div#cxA {
            flex: 1 0 200px; /*flex-grow + flex-shrink + flex-basis

            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;

            Alguns exemplos da shorthand flex:

            flex: initial = flex: 0 1 auto;
            flex: none = flex: 0 0 auto;
            flex: auto = flex: 1 1 auto;
            flex: 3 (ou qualquer valor) = flex: 3 1 auto; - Apenas definiu o valor de grow, o resto ficou padrão
            */
        }

        div#cxB {
            flex: 1 1 200px;
        }

        div#cxC {
            flex: 1 8 auto;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
